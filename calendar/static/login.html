<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — календарь POSTER</title>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
  <div class="login-box">
    <h1 style="margin:0 0 8px;font-size:1.2rem">Календарь материалов</h1>
    <p class="text-muted" style="margin:0 0 16px">Локальный вход. Демо: author / author или admin / admin</p>
    <form id="form">
      <div class="field"><label>Логин</label><input name="login" autocomplete="username" required></div>
      <div class="field"><label>Пароль</label><input name="password" type="password" autocomplete="current-password" required></div>
      <p class="error" id="err"></p>
      <button type="submit" class="primary" style="width:100%">Войти</button>
    </form>
  </div>
  <script src="/static/api.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const fd = new FormData(e.target);
      try {
        await apiForm("/api/login", fd);
        location.href = "/";
      } catch (ex) { showError(err, ex); }
    };
  </script>
</body>
</html>
